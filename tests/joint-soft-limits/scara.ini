[EMC]
VERSION = 1.1
MACHINE = scara-joint-soft-limits
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = scara.hal

[TRAJ]
COORDINATES = X Y Z A B C
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 20

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = scarakins coordinates=xyzcab
JOINTS = 6

[AXIS_X]
MIN_LIMIT = -25
MAX_LIMIT = 25
MAX_VELOCITY = 20
MAX_ACCELERATION = 200

[AXIS_Y]
MIN_LIMIT = -25
MAX_LIMIT = 25
MAX_VELOCITY = 20
MAX_ACCELERATION = 200

[AXIS_Z]
MIN_LIMIT = -25
MAX_LIMIT = 25
MAX_VELOCITY = 20
MAX_ACCELERATION = 200

[AXIS_A]
MIN_LIMIT = -180
MAX_LIMIT = 180
MAX_VELOCITY = 20
MAX_ACCELERATION = 200

[AXIS_B]
MIN_LIMIT = -180
MAX_LIMIT = 180
MAX_VELOCITY = 20
MAX_ACCELERATION = 200

[AXIS_C]
MIN_LIMIT = -180
MAX_LIMIT = 180
MAX_VELOCITY = 20
MAX_ACCELERATION = 200

[JOINT_0]
TYPE = ANGULAR
MIN_LIMIT = -180
MAX_LIMIT = 180
MAX_VELOCITY = 200
MAX_ACCELERATION = 1000
FERROR = 1
MIN_FERROR = 1
HOME = 0
HOME_OFFSET = 0
